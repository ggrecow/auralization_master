# OBS: some variables are indispensable for the auralizations. For those, a default value does not exist.
# When default values for a variable exist, the variable does not need to be defined here.
#
# Terminology: "sound emission predictions" (or "input data") are the predictions of the sound sources
# and of the flight trajectory given as input to the framework. In the examples, they come from PANAM
# (files auralization_input.dat and geschw_hoehe_verlauf.dat).

# -----------------------------------------------------------------------------------------------
# Master auralization parameters 
# -----------------------------------------------------------------------------------------------

# Boolean indicating whether figures (spectrograms, transfer functions, FIR filters, etc.)
# are saved in the results folder. Figures are useful to check the auralizations for problems,
# but can be turned off to save time and disk space. The .wav files are ALWAYS saved.
# DEFAULT value: save_figs = 1
save_figs	=	1

# sampling frequency, fs (Hz), which limits the max. frequency of the auralizations to a f_max=fs/2 (Hz)
# Must be an integer >= 44100 Hz, otherwise the run stops with an error. The time step of the input
# data, dt, is rounded to an integer number of samples, fs*dt (e.g. 0.125 s -> 6000 samples at 48 kHz;
# 5513 samples at 44.1 kHz, i.e. 0.01 % slower). Recommended values:
#  - 48000 Hz (DEFAULT): native rate of ECMA-418-2 (loudness) and of most audio interfaces used for
#    listening tests, so the metrics and the playback use the signals as rendered;
#  - 44100 Hz: native rate of the FABIAN HRTFs (no resampling of the HRIRs).
# With fs ~= 44100 Hz, the HRIRs are resampled (frequency response preserved) and the binaural
# signals contain no energy above 22.05 kHz, while the mono signal does. This is irrelevant for
# A-weighted levels, EPNL and loudness. Rates above 48 kHz bring no benefit, only longer computation.
# DEFAULT value: sampling_freq	=	48000
sampling_freq	=	48000

# this is used to trim the data if a very long flight trajectory is given in the input data, but not entirely desired 
# to be auralized (avoid long sound file). It is the time (seconds) after and before the max (EMISSION) SPL on the input data. 
# For ex., if 20 is provided, the auralized sound file will have a total of 40 sec. If the total time of the input file 
# is lower than 2*TrimTime, then the original time is kept.  
trim_time	=	10

# smoothing of the broadband spectra (engine broadband and airframe noise): 0 (no smoothing) or a positive integer.
# The input data give the broadband noise in third-octave bands. For the synthesis, the level of each band is spread
# evenly over the band, so the spectrum has steps at the band edges. Each smoothing iteration rounds off these steps
# a little more. Tonal components are not affected.
# Usually not needed: the propagation (air absorption, ground reflection) already smooths the spectrum.
# DEFAULT value: smoothings_emission_based	=	0
smoothings_emission_based	=	0

# An attenuation factor <AttenuationdB> can be applied in order to avoid clipping of on the .wav files. 
# This occurs when the magnitude of aircraft immission to be auralized is above 1 Pa = 94 dBSPL. 
# When an attenuation factor is provided, then the dBFS of the .wav file do no
# correspond anymore to Pascal values (i.e. an amplitude of +1/-1 does not correspond to 94 dB SPL = 1 (Pa)),
# so this value needs to be known in order to calibrate the signal for later analysis.
# For ex., an attenuation_db = -10 will lead to 104 dBFS, which can be corrected later 
# on by loading the .wav file and multipling it by a factor of 10^( (dBFS-94) /20) 
# DEFAULT value: attenuation_db	= 0 
#attenuation_db	=	0

# Boolean indicating whether a binaural signal shall be generated. In this case, the measured 
# HRTFs from the FABIAN database (DOI: 10.14279/depositonce-5718.5) are applied to the overall  
# aircraft signal considering the aircraft trajectory and the incidence angles, as calculated 
# by the ray-tracing algorithm, generating a stereo sound file. 
# The binaural signal is always rendered with the measured (blocked ear-canal) HRTFs, i.e. it is
# NOT equalized. See <generate_equalized_binaural> below for equalized versions.
# DEFAULT value: binaural_signal = 0 
binaural_signal	=	1

# Orientation (yaw) of the head used for the binaural synthesis, in degrees. DEFAULT value: head_orientation = 0
# It is a fixed rotation of the head in the horizontal (x-y) plane of the coordinate system of the input data: the same
# for all receivers, and it does not follow the aircraft. The HRTFs are evaluated at the azimuth from which
# the sound arrives at the receiver (0 = +x, 90 = +y) plus head_orientation. Increasing values turn the head
# CLOCKWISE seen from above (head facing direction = -head_orientation):
# head_orientation = 0   -> head faces +x (DEFAULT)
# head_orientation = 90  -> head faces -y
# head_orientation = 180 -> head faces -x
# head_orientation = 270 -> head faces +y
# For a flight towards +x (e.g. the PANAM approach and departure examples) and a receiver below the flight track (y = 0),
# the listener hears the aircraft:
# head_orientation = 0   -> from back -> overhead -> front
# head_orientation = 90  -> from right ear -> left ear
# head_orientation = 180 -> from front -> overhead -> back (listener faces the approaching aircraft)
# head_orientation = 270 -> from left ear -> right ear
# For a flight towards -x, front/back and left/right are swapped. For a lateral receiver, the aircraft passes
# on one side of the head, e.g. head_orientation = 0 and receiver at y > 0: back -> right ear -> front.
# To face the flight track, use 90 (receiver at y > 0) or 270 (receiver at y < 0). The HRTF angles of the
# direct path at the first and last time step are printed in the log (log.txt) for each receiver.
head_orientation =	90

# Boolean indicating whether diffuse-field (DF) and free-field (FF) equalized versions of the
# binaural signal are generated in addition (only used if binaural_signal = 1). Both are obtained
# from the rendered (non-equalized) binaural signal, i.e. all three .wav files come from the SAME
# rendering (see <convert_binaural_equalization>; the conversion is exact, as both equalizations
# are fixed linear filters per ear). Set to 0 to save time and disk space in large auralizations.
#
# The non-equalized binaural signal contains the response of the outer ear (mainly the concha
# resonance and the pressure build-up at head and pinna), as the FABIAN HRTFs were measured at the
# blocked ear-canal entrance. The three binaural .wav files and their use are:
#
#  *_overallSignal_binaural_FS*.wav (always, if binaural_signal = 1)
#     sound pressure at the blocked ear-canal entrance. For headphone playback with a MEASURED
#     headphone compensation filter (inverse of the headphone transfer function at the blocked
#     ear-canal entrance, e.g. the FABIAN headphone filters). Recommended for listening experiments.
#
#  *_overallSignal_binaural_DFeq_FS*.wav (if generate_equalized_binaural = 1)
#     diffuse-field equalized: HRTFs divided by the common transfer function (CTF), i.e. their
#     diffuse-field average (inverted, 3rd-octave smoothed, minimum-phase CTF of the FABIAN database,
#     same filter for both ears). For headphones equalized to a diffuse-field target, without
#     further headphone filter (demonstrations, informal listening). Do NOT combine with a measured
#     headphone filter, otherwise the common response is removed twice.
#
#  *_overallSignal_binaural_FFeq_FS*.wav (if generate_equalized_binaural = 1)
#     free-field equalized: HRTFs divided by the frontal HRTF (az = 0, el = 0) of the same ear, per
#     third-octave band. The signal is then the frontal free-field sound pressure (without listener)
#     that would produce the same ear signal; for a frontal source it equals the mono (microphone)
#     signal. For COMPUTING METRICS (LAeq, LAmax, LAE, EPNL, ECMA-418-2 loudness with field type
#     'free-frontal', ...), which already contain the outer-ear effect of a frontal free field or
#     assume the sound pressure without listener. Metrics computed from the non-equalized signal
#     would count the outer ear twice. Not meant for headphone playback.
#
# Reference: Brinkmann et al., FABIAN head-related transfer function data base,
# DOI: 10.14279/depositonce-5718
# DEFAULT value: generate_equalized_binaural = 0
generate_equalized_binaural	=	1

# -----------------------------------------------------------------------------------------------
# Doppler effect
# -----------------------------------------------------------------------------------------------
#
# How the Doppler effect is included in the auralization. This is a decision of the user and it
# MUST match the sound emission predictions used: the framework cannot detect whether they contain
# the Doppler effect or not (for PANAM: a run with or without the Doppler effect).
#
#   doppler_method = input (DEFAULT)
#       The sound emission predictions already contain the Doppler effect (e.g. PANAM run WITH
#       Doppler). The buzzsaw tones, which are calculated from the engine speed, are
#       Doppler-shifted with the emission angle given in the input data. The time steps of the
#       predictions are placed at the receiver at constant intervals (dt of the input data), i.e.
#       the timing at the receiver follows the timing of the source; the Doppler shift of the
#       frequencies comes from the predictions.
#
#   doppler_method = delay_line
#       The sound emission predictions do NOT contain the Doppler effect (e.g. PANAM run WITHOUT
#       Doppler). Each time step of the predictions is placed at the time it reaches the receiver (emission time +
#       propagation time of the eigenray, from the ray tracing), separately for the direct and
#       the ground-reflected sound path. The steps therefore arrive at uneven intervals: closer
#       together while the aircraft approaches, further apart while it moves away. Compressing
#       and stretching the signal between the steps produces the Doppler shift, so pitch and
#       timing at the receiver both follow from the propagation times (variable delay lines).
#       Consequences:
#        - each sound path has its own Doppler shift, consistent with the ray tracing (also
#          with refraction and wind)
#        - the .wav files are slightly shorter or longer than with doppler_method = input
#        - the propagation filters act at the received (Doppler-shifted) frequencies
#       Using predictions WITH Doppler effect here applies the Doppler effect twice.
#
# DEFAULT value: doppler_method = input
doppler_method	=	input

# Convective amplification (only used with doppler_method = delay_line): a source moving towards
# the receiver is louder than the same source at rest. With convective_amplification = 1, the
# level of each sound path is changed by -40*log10(D), where D = 1 - M*cos(theta) is the Doppler
# factor obtained from the propagation times (for M = 0.25: up to +5.0 dB while the aircraft
# approaches and down to -3.9 dB while it moves away). Use 1 if the sound emission predictions do
# not contain the convective amplification, and 0 if they already contain it.
# DEFAULT value: convective_amplification = 0
convective_amplification	=	0

# -----------------------------------------------------------------------------------------------
# Inputs for Buzzsaw noise synthesis
# -----------------------------------------------------------------------------------------------

# Max. rotational engine speed, n1 in rotations per minute. This value needs to be known for 
# a particular engine type. Here, we convert from its a CFM56 turbofan engine, with n1 given in 
# Hertz, so we convert into rpm -> 83.3(Hz)*60 = 4998 rpm 
max_rotations_per_minute	=	4998  

#total number of tones to be sinthesised (i.e. 1 fundamental tone + (nHarmonics-1) harmonics)
n_harmonics	=	201

# -----------------------------------------------------------------------------------------------
# Atmospheric and sound propagation parameters
# -----------------------------------------------------------------------------------------------
#
# The atmospheric transfer function between each pair of source/receiver positions is calculated 
# considering each position of the aircraft during its flight trajectory (as given in the input data, 
# without any interpolation) using the  ART ray tracing tool [1], v2023a, which can be
# downloaded from [2]. Please consult Refs. [1] and [2] to know more about which atmospheric
# conditions the ART software can consider. 
# 
# The atmospheric transfer function of the direct path and a 1st order reflected ray are 
# computed using the ART software. For the reflected ray, the ground reflection is considered 
# using Miki's model [3] and spherical wave correction factor. The only input necessary is the is 
# effective flow resistance [kg·s^−1·m^−3] or [Pa·s· m^−2] describing the ground's material. Typical effective flow 
# resistance values are [4]:
# 
#   sigma_e = { 'snow' : 25e3, 'forest' : 50e3, 'grass' : 250e3, 'dirt_roadside' : 500e3, 
#                       'dirt' : 5000e3, 'asphalt' : 10000e3, 'concrete' : 50000e3 };
#
# After the calculation of the atmospheric transfer function,
# they are converted into FIR filters and applied to the sinthesized sound
# source descriptions (sound emission predictions).
#
#   [1] Philipp Schäfer & Michael Vorländer (2021),  Atmospheric Ray Tracing: An efficient, 
#   open-source framework for finding eigenrays in a stratified, moving
#   medium, Acta Acust., 5, 26. https://doi.org/10.1051/aacus/2021018  
#
#   [2] https://www.virtualacoustics.org/GA/art/#download (Last viewed 12 March 2024)
#
#   [3] Y. Miki (1990), Acoustical properties of porous materials -
#         Modifications of Delany-Bazley models, J. Acoust. Soc. Jpn
#
#   [4] Michael Arntzen (2014), Aircraft noise calculation and synthesis in a
#        non-standard atmosphere, PhD thesis, Delft university (chapter 3.2)
#
# -----------------------------------------------------------------------------------------------

# import atmospheric soundings (.txt file from http://weather.uwyo.edu/upperair/sounding_legacy.html)
# uses altitude-dependent temperature (Celsius), pressure (hPa), relative humidity (%) and wind (kt) to describe atmosphere
# WARNING: input units are assumed to be as defined above, and automatically converted accordingly
#
# The path to the sounding file can be given in two ways:
#
#   - RELATIVE path (recommended): interpreted relative to the folder where THIS .ini file is located,
#     independent of MATLAB's current folder (also works in the compiled .exe). For ex., if the
#     sounding file is inside a subfolder 'atmosphere_soundings' next to this .ini:
#         sounding_filepath = atmosphere_soundings\Munich_autumn.txt
#     Forward slashes (atmosphere_soundings/Munich_autumn.txt) also work, and additionally on Linux/macOS.
#     This way, the case folder (.ini + soundings) can be copied/moved anywhere without changes.
#
#   - ABSOLUTE path: used as is. For ex.:
#         sounding_filepath = C:\data\soundings\Munich_autumn.txt
#
# The full path of the sounding file actually used is printed in the command window.
sounding_filepath = atmosphere_soundings\ExtremeHotDry.txt

# consider ground reflection (boolean : 0 = only direct path, 1 = direct path + ground reflection)
# DEFAULT value: consider_ground_reflection	=	1
#
# What "1" means depends on the receiver height zobs, which comes from the input data (receiver position):
#
#   zobs > 0  -> direct path + 1st order reflected path found by the ray tracer. The two paths
#                are summed with their relative delay, which produces the usual ground
#                interference pattern (comb filter).
#   zobs = 0  -> flush-mounted receiver. The reflection point coincides with the receiver, so
#                only the direct eigenray is traced and the surface reflection factor is applied
#                as p_tot = p_dir * (1 + Q). No interference pattern, no delay difference;
#                see <sigma_e> below and issue #4.
#
# Setting 0 with zobs = 0 gives the free-field direct path only, i.e. WITHOUT the +6 dB a
# flush-mounted microphone would actually measure. Use 0 only if that is what you intend.
consider_ground_reflection	=	1

# effective flow resistance [Pa·s·m^−2] = [kg·s^−1·m^−3] describing the ground's material.
# DEFAULT value: sigma_e = 100000e3 -> very hard surface
#
# Note on flush-mounted (ground-plane) receivers, i.e. zobs = 0:
# in this case there is no second propagation path, and the total sound pressure is
# p_tot = p_dir * (1 + Q), where Q is the surface reflection factor obtained from <sigma_e>.
# The choice of <sigma_e> therefore decides the frequency response of the receiver:
#
#   sigma_e >= 50000e3 (concrete/plate) -> |Q| -> 1, i.e. the full +6 dB pressure doubling
#                                          at all frequencies. This is what a certification-style
#                                          ground-plane microphone on a hard plate realizes
#                                          (ICAO Annex 16 / ISO 20906) and what should be used
#                                          when comparing against such measurements.
#   sigma_e = 250e3 (grass)             -> |Q| < 1 near normal incidence, so the gain is
#                                          frequency-dependent and below +6 dB. Use this only
#                                          if the microphone is really flush with a porous surface.
#
# In both cases there are no interference dips, since the path difference is zero.
sigma_e	=	250e3


# -----------------------------------------------------------------------------------------------
# Turbulence-induced coherence loss between direct and ground-reflected sound
# -----------------------------------------------------------------------------------------------
# Atmospheric turbulence partially decorrelates the direct and the ground-reflected sound, which
# fills in the interference dips of the ground effect (less "flanging" at large distances).
# The reflected path is filtered with random-phase decorrelation filters, redrawn every 0.1 s,
# whose ensemble average reproduces the coherence factor Ccoh(f) = exp(-w f^2).
#
# References:
#   [1] R. Pieren, D. Lincke, "Auralization of aircraft flyovers with turbulence-induced
#       coherence loss in ground effect", J. Acoust. Soc. Am. 151(4), 2453-2460 (2022).
#       https://doi.org/10.1121/10.0010121
#   [2] V. E. Ostashev, D. J. Breton, D. K. Wilson, "Interference of the direct and
#       ground-reflected waves in the atmosphere with volumetric scattering",
#       J. Acoust. Soc. Am. 156(1), 107-118 (2024). https://doi.org/10.1121/10.0026452
#
# Only active if consider_ground_reflection = 1 and zobs > 0 (not for flush-mounted receivers).
# The turbulence parameterization is valid for daytime / neutral conditions only
# (turb_surface_heat_flux >= 0). Negative values (stable, night-time) are treated as 0.
#
# Exemplary values (from [1] and [2]):
#
#   Condition                      |  u* [m/s]  |  QH [W/m2]  |  zi [m]  | Source
#   -------------------------------|------------|-------------|----------|-------------------------------
#   Overcast, moderate wind        |    0.3     |      0      |   1500   | [2], Sec. V B (cloudy)
#   Sunny, moderate wind           |    0.3     |     400     |   1500   | [2], Sec. V B (sunny)
#   Weak turbulence                |    0.1     |      50     |   1000   | [1], Fig. 1
#   Morning, light wind            |    0.08    |      68     |   350    | [1], Sec. IV A (takeoff, ERA5)
#   Morning, light wind            |    0.09    |      55     |   520    | [1], Sec. IV A (landing, ERA5)
#   Calm          			       |    0.05    |      0      |   500    |  
#
#   u* = turb_friction_velocity, QH = turb_surface_heat_flux, zi = turb_abl_height
#
# Typical ranges (rough orientation only):
#   friction velocity : ~0.05 (calm) ... ~0.6 m/s (strong wind)
#   heat flux         : 0 (overcast) ... 50-100 (morning, partly cloudy) ... 200-400 W/m2 (clear summer midday)
#   ABL height        : ~300-500 m (morning) ... ~1000-2000 m (convective afternoon)
#
# consider coherence loss (boolean : 0 = off, 1 = on)
# DEFAULT value: consider_coherence_loss	=	0
consider_coherence_loss	=	0

# coherence model (String: 'slanted' = [2], Eq. 52; 'homogeneous' = [1], Eq. 4)
# DEFAULT value: coherence_model	=	slanted
coherence_model	=	slanted

# friction velocity u* [m/s], shear-produced turbulence (ERA5: zust)
turb_friction_velocity	=	0.3

# surface sensible heat flux QH [W/m^2], positive upwards (ERA5, hourly: QH = -sshf/3600)
turb_surface_heat_flux	=	400

# atmospheric boundary layer height zi [m] (ERA5: blh)
turb_abl_height	=	1000

# OPTIONAL surface temperature for the turbulence model, in degree Celsius
# DEFAULT: ground temperature of the atmosphere used for ray tracing
# turb_surface_temperature	=	15

# OPTIONAL seed of the random decorrelation filters (same seed = identical auralization)
# DEFAULT value: coherence_seed	=	1
coherence_seed	=	1