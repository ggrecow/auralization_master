# OBS: some variables are indispensable for the auralizations. For those, a default value does not exist.
# When default values for a variable exist, the variable does not need to be defined here.

# -----------------------------------------------------------------------------------------------
# Master auralization parameters 
# -----------------------------------------------------------------------------------------------

# sampling frequency, fs (Hz), which limits the max. frequency of the auralizations to a f_max=fs/2 (Hz)
# DEFAULT value: sampling_freq	=	48000
sampling_freq	=	48000

# this is used to trim the data if a very long flight trajectory is considered in PANAM, but not entirely desired 
# to be auralized (avoid long sound file). It is the time (seconds) after and before the max (EMISSION) SPL on the input data. 
# For ex., if 20 is provided, the auralized sound file will have a total of 40 sec. If the total time of the input file 
# provided by PANAM is lower than 2*TrimTime, then the original time is kept.  
trim_time	=	20

# number of iterations used for freq smoothing procedure during the conversion 
# from 1/3-OB to narrowband (can be ZERO). This is mainly usefull for immission-based auralizations.
# DEFAULT VALUE = 0 
smoothings_emission_based	=	0

# An attenuation factor <AttenuationdB> can be applied in order to avoid clipping of on the .wav files. 
# This occurs when the magnitude of aircraft immission to be auralized is above 1 Pa = 94 dBSPL. 
# When an attenuation factor is provided, then the dBFS of the .wav file do no
# correspond anymore to Pascal values (i.e. an amplitude of +1/-1 does not correspond to 94 dB SPL = 1 (Pa)),
# so this value needs to be known in order to calibrate the signal for later analysis.
# For ex., an attenuation_db = -10 will lead to 104 dBFS, which can be corrected later 
# on by loading the .wav file and multipling it by a factor of 10^( (dBFS-94) /20) 
# DEFAULT value: attenuation_db	= 0 
#attenuation_db	=	0

# Boolean indicating whether a binaural signal shall be generated. In this case, the measured 
# HRTFs from the FABIAN database (DOI: 10.14279/depositonce-5718.5) are applied to the overall  
# aircraft signal considering the aircraft trajectory and the incidence angles, as calculated 
# by the ray-tracing algorithm, generating a stereo sound file. 
# DEFAULT value: binaural_signal = 0 
binaural_signal	=	1

# Orientation of the head used for binaural synthesis process. Angle convention here coincide with azimuth
# angle adopted by the FABIAN database, i.e. increases counterclockwise. By default, the front of the head 
# points to positive x-axis, head_orientation = 0 (degrees). For ex.,
# head_orientation = 90 -> head pointing to positive y-axis
# head_orientation = 180 -> head pointing to negative x-axis
# head_orientation = 270 -> head pointing to negative y-axis
head_orientation =	0

# -----------------------------------------------------------------------------------------------
# Inputs for Buzzsaw noise synthesis
# -----------------------------------------------------------------------------------------------

# Max. rotational engine speed, n1 in rotations per minute. This value needs to be known for 
# a particular engine type. Here, we convert from its a CFM56 turbofan engine, with n1 given in 
# Hertz, so we convert into rpm -> 83.3(Hz)*60 = 4998 rpm 
max_rotations_per_minute	=	4998  

#total number of tones to be sinthesised (i.e. 1 fundamental tone + (nHarmonics-1) harmonics)
n_harmonics	=	201

# -----------------------------------------------------------------------------------------------
# Atmospheric and sound propagation parameters
# -----------------------------------------------------------------------------------------------
#
# The atmospheric transfer function between each pair of source/receiver positions is calculated 
# considering each position of the aircraft during its flight trajectory (as is from PANAM input, 
# without any interpolation) using the  ART ray tracing tool [1], v2023a, which can be
# downloaded from [2]. Please consult Refs. [1] and [2] to know more about which atmospheric
# conditions the ART software can consider. 
# 
# The atmospheric transfer function of the direct path and a 1st order reflected ray are 
# computed using the ART software. For the reflected ray, the ground reflection is considered 
# using Miki's model [3] and spherical wave correction factor. The only input necessary is the is 
# effective flow resistance [kg·s^−1·m^−3] or [Pa·s· m^−2] describing the ground's material. Typical effective flow 
# resistance values are [4]:
# 
#   sigma_e = { 'snow' : 25e3, 'forest' : 50e3, 'grass' : 250e3, 'dirt_roadside' : 500e3, 
#                       'dirt' : 5000e3, 'asphalt' : 10000e3, 'concrete' : 50000e3 };
#
# After the calculation of the atmospheric transfer function,
# they are converted into FIR filters and applied to the sinthesized sound
# source descriptions provided by PANAM.
#
#   [1] Philipp Schäfer & Michael Vorländer (2021),  Atmospheric Ray Tracing: An efficient, 
#   open-source framework for finding eigenrays in a stratified, moving
#   medium, Acta Acust., 5, 26. https://doi.org/10.1051/aacus/2021018  
#
#   [2] https://www.virtualacoustics.org/GA/art/#download (Last viewed 12 March 2024)
#
#   [3] Y. Miki (1990), Acoustical properties of porous materials -
#         Modifications of Delany-Bazley models, J. Acoust. Soc. Jpn
#
#   [4] Michael Arntzen (2014), Aircraft noise calculation and synthesis in a
#        non-standard atmosphere, PhD thesis, Delft university (chapter 3.2)
#
# -----------------------------------------------------------------------------------------------

# import atmospheric soundings (.txt file from http://weather.uwyo.edu/upperair/sounding_legacy.html)
# uses altitude-dependent temperature (Celsius), pressure (hPa), relative humidity (%) and wind (kt) to describe atmosphere
# WARNING: input units are assumed to be as defined above, and automatically converted accordingly
#
# The path to the sounding file can be given in two ways:
#
#   - RELATIVE path (recommended): interpreted relative to the folder where THIS .ini file is located,
#     independent of MATLAB's current folder (also works in the compiled .exe). For ex., if the
#     sounding file is inside a subfolder 'atmosphere_soundings' next to this .ini:
#         sounding_filepath = atmosphere_soundings\Munich_autumn.txt
#     Forward slashes (atmosphere_soundings/Munich_autumn.txt) also work, and additionally on Linux/macOS.
#     This way, the case folder (.ini + soundings) can be copied/moved anywhere without changes.
#
#   - ABSOLUTE path: used as is. For ex.:
#         sounding_filepath = C:\data\soundings\Munich_autumn.txt
#
# The full path of the sounding file actually used is printed in the command window.
sounding_filepath = atmosphere_soundings\ExtremeHotDry.txt

# consider ground reflection (boolean : 0 = only direct path, 1 = direct path + ground reflection)
# DEFAULT value: consider_ground_reflection	=	1
#
# What "1" means depends on the receiver height zobs, which comes from the PANAM input file:
#
#   zobs > 0  -> direct path + 1st order reflected path found by the ray tracer. The two paths
#                are summed with their relative delay, which produces the usual ground
#                interference pattern (comb filter).
#   zobs = 0  -> flush-mounted receiver. The reflection point coincides with the receiver, so
#                only the direct eigenray is traced and the surface reflection factor is applied
#                as p_tot = p_dir * (1 + Q). No interference pattern, no delay difference;
#                see <sigma_e> below and issue #4.
#
# Setting 0 with zobs = 0 gives the free-field direct path only, i.e. WITHOUT the +6 dB a
# flush-mounted microphone would actually measure. Use 0 only if that is what you intend.
consider_ground_reflection	=	1

# effective flow resistance [Pa·s·m^−2] = [kg·s^−1·m^−3] describing the ground's material.
# DEFAULT value: sigma_e = 100000e3 -> very hard surface
#
# Note on flush-mounted (ground-plane) receivers, i.e. zobs = 0:
# in this case there is no second propagation path, and the total sound pressure is
# p_tot = p_dir * (1 + Q), where Q is the surface reflection factor obtained from <sigma_e>.
# The choice of <sigma_e> therefore decides the frequency response of the receiver:
#
#   sigma_e >= 50000e3 (concrete/plate) -> |Q| -> 1, i.e. the full +6 dB pressure doubling
#                                          at all frequencies. This is what a certification-style
#                                          ground-plane microphone on a hard plate realizes
#                                          (ICAO Annex 16 / ISO 20906) and what should be used
#                                          when comparing against such measurements.
#   sigma_e = 250e3 (grass)             -> |Q| < 1 near normal incidence, so the gain is
#                                          frequency-dependent and below +6 dB. Use this only
#                                          if the microphone is really flush with a porous surface.
#
# In both cases there are no interference dips, since the path difference is zero.
sigma_e	=	250e3

